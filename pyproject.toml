[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mongodb-typesafe-aggregation"
dynamic = ["version"]
description = "A type-safe, fluent builder for MongoDB aggregation pipelines. Works with PyMongo, Motor and any driver that accepts a list of stages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Chimzuruoke Okafor" }, { name = "Augustine Best" }]
keywords = ["mongodb", "pymongo", "motor", "aggregation", "pipeline", "type-safe", "fluent", "builder"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zuruoke/mongodb-typesafe-aggregation-py#readme"
Repository = "https://github.com/zuruoke/mongodb-typesafe-aggregation-py.git"
Issues = "https://github.com/zuruoke/mongodb-typesafe-aggregation-py/issues"
Changelog = "https://github.com/zuruoke/mongodb-typesafe-aggregation-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pydantic>=2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "typing-extensions>=4.12",
]

[tool.hatch.version]
path = "src/mongodb_typesafe_aggregation/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/mongodb-pipeline-demo-py", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/mongodb_typesafe_aggregation"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mongodb-pipeline-demo-py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["mongodb_typesafe_aggregation"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]
